CONFIG_DEFAULT_DEVICE_TREE="imx6sx-blaze"

# Early console on UART3; the DCD muxes the pads before U-Boot runs.
CONFIG_DEBUG_UART=y
CONFIG_DEBUG_UART_MXC=y
CONFIG_DEBUG_UART_BASE=0x021ec000
# pll3/6, the reset source. Only correct when entered from reset:
# arch_cpu_init() switches the UART to the 24 MHz osc afterwards.
CONFIG_DEBUG_UART_CLOCK=80000000
CONFIG_DEBUG_UART_ANNOUNCE=y

# A serial-download boot takes the environment and fastboot device from this.
# An eMMC boot takes it from board_mmc_get_env_dev().
CONFIG_SYS_MMC_ENV_DEV=0

# ...and at the end of its boot0 partition, as on Toradex's own eMMC modules.
CONFIG_SYS_MMC_ENV_PART=1
CONFIG_ENV_OFFSET=0xFFFFDE00

# A second copy, so a power cut during the boot script's env save cannot leave
# the board without one. -0x4200 sits just below the primary at -0x2200.
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_OFFSET_REDUND=0xFFFFBE00

# For `mmc partconf`, which selects the partition the ROM boots from.
CONFIG_SUPPORT_EMMC_BOOT=y

# For `env erase`, used by the install script.
CONFIG_CMD_ERASEENV=y

# The PHY is a Micrel KSZ8081; the defconfig builds only the Atheros driver.
CONFIG_PHY_MICREL=y
CONFIG_PHY_MICREL_KSZ8XXX=y

# Without these, reset_cpu() resolves to the empty weak stub in
# mach-imx/cpu.c and `reset` does nothing.
CONFIG_WDT=y
CONFIG_IMX_WATCHDOG=y
CONFIG_SYSRESET=y
CONFIG_SYSRESET_WATCHDOG=y

# ...but do not arm it here: AUTOSTART starts the timer as soon as U-Boot has a
# watchdog device, the uuu install runs longer than that unserviced, and the
# i.MX watchdog cannot be stopped once started. systemd arms it instead.
# CONFIG_WATCHDOG_AUTOSTART is not set

# The board file's LVDS/LCD setup drives SD1_DATA1/2 as GPIOs; here they are
# eMMC data lines.
# CONFIG_VIDEO is not set
