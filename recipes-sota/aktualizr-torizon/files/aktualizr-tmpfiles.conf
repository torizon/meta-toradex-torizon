# Aktualizr does not want these files to be removed by automatic cleanup
x /tmp/aktualizr-* 0700 root root -
# Nothing on the target recreates aktualizr's state directory, and an image
# customised by torizoncore-builder does not inherit it from the base deployment.
# Must stay lower-case 'd': 'D' would empty it on every boot, taking the device
# key with it.
d /var/sota 0700 root root -
