CONFIG_BLK_DEV_THROTTLING=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_WIREGUARD=m
CONFIG_SWAP=y
CONFIG_ZSMALLOC=y
CONFIG_KERNEL_LZ4=y
CONFIG_CRYPTO_LZ4=y
